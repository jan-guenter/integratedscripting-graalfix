name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up GraalVM Community 21.0.2
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '21.0.2'
          distribution: graalvm-community
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify and build
        run: ./gradlew --no-daemon clean check build
      - name: Create checksums
        run: sha256sum build/libs/integratedscripting_graalfix-*.jar > SHA256SUMS.txt
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}"
          build/libs/integratedscripting_graalfix-*.jar
          SHA256SUMS.txt
          --generate-notes
          --verify-tag
          --title "Integrated Scripting GraalVM Fix ${GITHUB_REF_NAME}"
