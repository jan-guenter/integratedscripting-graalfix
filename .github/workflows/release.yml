name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up GraalVM Community 21.0.2
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '21.0.2'
          distribution: graalvm-community
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: gradle/actions/setup-gradle@v6
      - name: Verify tag matches mod version
        shell: bash
        run: |
          mod_version="$(sed -n 's/^mod_version=//p' gradle.properties)"
          if [[ "${GITHUB_REF_NAME}" != "v${mod_version}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match mod_version=${mod_version}." >&2
            exit 1
          fi
      - name: Verify and build
        run: ./gradlew --no-daemon clean check build
      - name: Publish Maven package
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./gradlew --no-daemon publish
      - name: Create checksums
        run: sha256sum build/libs/integratedscripting_graalfix-*.jar > SHA256SUMS.txt
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}"
          build/libs/integratedscripting_graalfix-*.jar
          SHA256SUMS.txt
          --generate-notes
          --verify-tag
          --title "Integrated Scripting GraalVM Fix ${GITHUB_REF_NAME}"
