plugins {
    id 'java-library'
    id 'checkstyle'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.143'
}

group = mod_group_id
version = mod_version

base {
    archivesName = mod_id
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}

neoForge {
    version = '21.1.248'

    mods {
        integratedscripting_graalfix {
            sourceSet sourceSets.main
        }
    }
}

repositories {
    mavenCentral()
}

tasks.named('processResources', ProcessResources).configure {
    def values = [mod_id: mod_id, mod_name: mod_name, mod_version: mod_version]
    inputs.properties(values)
    filesMatching('META-INF/neoforge.mods.toml') {
        expand(values)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

checkstyle {
    toolVersion = '10.18.2'
    configFile = file('config/checkstyle/checkstyle.xml')
}

tasks.withType(Checkstyle).configureEach {
    reports {
        xml.required = true
        html.required = true
    }
}

publishing {
    publications {
        mod(MavenPublication) {
            from components.java
            artifactId = mod_id

            pom {
                name = mod_name
                description = 'Transition helper for Integrated Scripting 1.0.24 after its upstream GraalVM fix'
                url = 'https://github.com/jan-guenter/integratedscripting-graalfix'
                licenses {
                    license {
                        name = 'MIT License'
                        url = 'https://opensource.org/license/mit'
                    }
                }
                scm {
                    connection = 'scm:git:https://github.com/jan-guenter/integratedscripting-graalfix.git'
                    developerConnection = 'scm:git:ssh://git@github.com/jan-guenter/integratedscripting-graalfix.git'
                    url = 'https://github.com/jan-guenter/integratedscripting-graalfix'
                }
            }
        }
    }

    repositories {
        maven {
            name = 'GitHubPackages'
            url = uri('https://maven.pkg.github.com/jan-guenter/integratedscripting-graalfix')
            credentials {
                username = System.getenv('GITHUB_ACTOR')
                password = System.getenv('GITHUB_TOKEN')
            }
        }
    }
}
