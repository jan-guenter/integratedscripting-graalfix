plugins {
    id 'java-library'
    id 'checkstyle'
    id 'net.neoforged.moddev' version '2.0.141'
}

group = mod_group_id
version = mod_version

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = '21.1.234'

    mods {
        integratedscripting_graalfix {
            sourceSet sourceSets.main
        }
    }
}

repositories {
    mavenCentral()
}

tasks.named('processResources', ProcessResources).configure {
    def values = [mod_id: mod_id, mod_name: mod_name, mod_version: mod_version]
    inputs.properties(values)
    filesMatching('META-INF/neoforge.mods.toml') {
        expand(values)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

checkstyle {
    toolVersion = '10.18.2'
    configFile = file('config/checkstyle/checkstyle.xml')
}

tasks.withType(Checkstyle).configureEach {
    reports {
        xml.required = true
        html.required = true
    }
}

jar {
    manifest.attributes('MixinConfigs': 'integratedscripting_graalfix.mixins.json')
}
