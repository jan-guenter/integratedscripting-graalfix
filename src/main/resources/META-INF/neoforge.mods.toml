modLoader = "javafml"
loaderVersion = "[4,)"
license = "MIT"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
description = '''
Client-only transition helper for Integrated Scripting 1.0.24 after its upstream GraalVM fix.
This release intentionally applies no Mixin.
'''

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "[21.1.248,21.2)"
ordering = "NONE"
side = "CLIENT"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "[1.21.1,1.21.2)"
ordering = "NONE"
side = "CLIENT"

[[dependencies.${mod_id}]]
modId = "integratedscripting"
type = "required"
versionRange = "[1.0.24]"
ordering = "AFTER"
side = "CLIENT"
